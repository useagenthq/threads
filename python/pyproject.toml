[project]
# Placeholder name; not published to PyPI yet (the "Private" classifier makes uploads fail).
name = "threads"
version = "0.0.0"
description = "Event-log agent framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.8.0,<2",
]
openai = [
    "openai>=3.19.0,<4",
]
litellm = [
    "litellm>=1.83.0,<2",
]
e2b = [
    "e2b>=2.51,<3",
]
daytona = [
    "daytona>=0.216,<0.217",
]
modal = [
    "modal>=1.5.5,<2",
]
mcp = [
    "jsonschema>=4.23,<5",
    "mcp>=1.20,<2",
]
supermemory = [
    "supermemory>=3.62,<4",
]
zep = [
    "zep-cloud>=3.28,<4",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "hypothesis",
    "datamodel-code-generator==0.82.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ANN", "PT", "TC", "PL", "C90"]

[tool.ruff.lint.per-file-ignores]
# pytest is built on bare assert.
"tests/**" = ["S101"]
# Docstrings are schema descriptions copied verbatim; the formatter doesn't wrap them.
"src/threads/_generated/events_v1.py" = ["E501"]
"src/threads/_generated/host_api_v1.py" = ["E501"]
# Its queries are composed from constant scope and revision fragments; every value is bound.
"src/threads/memory/local_knowledge.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["live: the live gate; sends real provider requests, only with THREADS_LIVE=1"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff.lint.mccabe]
max-complexity = 10
