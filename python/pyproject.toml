[project]
# Placeholder name; not published to PyPI yet (the "Private" classifier makes uploads fail).
name = "threads"
version = "0.0.0"
license = "Apache-2.0"
description = "Event-log agent framework."
readme = "README.md"
requires-python = ">=3.12"
# typing_extensions: Extension's deps type parameter defaults to None (PEP 696, not in 3.12's
# typing). pydantic already depends on it, so this installs nothing new; declared because the
# core imports it directly.
dependencies = ["pydantic>=2,<3", "typing_extensions>=4.12"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.8.0,<2",
]
openai = [
    "openai>=3.19.0,<4",
]
litellm = [
    "litellm>=1.83.0,<2",
]
e2b = [
    "e2b>=2.51,<3",
]
daytona = [
    "daytona>=0.216,<0.217",
]
modal = [
    "modal>=1.5.5,<2",
]
mcp = [
    "jsonschema>=4.23,<5",
    "mcp>=1.20,<2",
]
supermemory = [
    "supermemory>=3.62,<4",
]
zep = [
    "zep-cloud>=3.28,<4",
]
# threads.postgres (lane 27): Postgres has no official vendor SDK. psycopg 3 is the maintained
# reference adapter, with binary wheels; its sync connection fits the store's worker thread, and
# its errors carry typed SQLSTATEs (serialization failures, connection loss).
postgres = [
    "psycopg[binary]>=3.2,<3.3",
]
# threads.host over HTTP. Starlette: spec/api.json types host(authenticate)
# with starlette.requests.Request and Host.asgi as starlette.types.ASGIApp, and it is the
# smallest routing/SSE layer that runs on any ASGI server. Uvicorn: the minimal ASGI server
# `threads dev` and `threads start` run it on. Core stays pydantic-only; the library methods of
# threads.host import neither.
host = [
    "starlette>=1.6,<2",
    "uvicorn>=0.53,<1",
]
# Channel adapters. Slack: its official SDK verifies the signing secret
# (slack_sdk.signature). Outbound sends of every channel go through httpx, the client the other
# adapters already send through, so the run's fence is checked at the real send point (the
# connection's send_request_headers trace); WhatsApp Cloud and GitHub publish no official
# Python SDK, so their REST APIs are called directly.
slack = [
    "slack-sdk>=3.40,<4",
    "httpx>=0.28,<1",
]
whatsapp = [
    "httpx>=0.28,<1",
]
github = [
    "httpx>=0.28,<1",
]
# threads.otel. httpx: the asyncio HTTP client the channel adapters already use (the stdlib has no
# async HTTP client, and AGENTS.md forbids threads for I/O). No OpenTelemetry SDK in either
# language: the SDK generates random span ids and does its own batching and encoding, while this
# exporter needs ids derived from event ids (safe re-sends) and OTLP bytes identical in TypeScript
# and Python (golden tests). OTLP/HTTP JSON is a stable wire format that collectors and the major
# vendors accept on port 4318.
otel = [
    "httpx>=0.28,<1",
]

[project.scripts]
threads = "threads.cli:main"

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "hypothesis",
    "datamodel-code-generator==0.82.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests", "tools", "examples"]
extraPaths = ["src", "tests", "../spec/tools", "../docs/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
# docs/scripts/gen_api_ref.py imports its sibling api_ref package, which imports spec/tools/api_docs.py;
# the spec tools import each other.
executionEnvironments = [{ root = "../docs/scripts" }, { root = "../spec/tools" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ANN", "PT", "TC", "PL", "C90"]

[tool.ruff.lint.per-file-ignores]
# pytest is built on bare assert.
"tests/**" = ["S101"]
# Docs examples are read as written: imports stay plain, never behind TYPE_CHECKING.
"examples/**" = ["TC"]
# Docstrings are schema descriptions copied verbatim; the formatter doesn't wrap them.
"src/threads/_generated/events_v1.py" = ["E501"]
"src/threads/_generated/host_api_v1.py" = ["E501"]
# Its queries are composed from constant scope and revision fragments; every value is bound.
"src/threads/memory/local_knowledge.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "../spec/tools", "../docs/scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "live: the live gate; sends real provider requests, only with THREADS_LIVE=1",
    "jobs: crash drills; real child processes on one store, killed and restarted",
    "sqlite_only: pins SQLite itself (its pragmas or file); the Postgres leg skips it",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff.lint.mccabe]
max-complexity = 10
