<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="hero-title">
<title id="hero-title">threads: Agents you can replay, fork and trust.</title>
<style>@font-face{font-family:"Inter";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Inter";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Geist Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}:root{--paper:#FFFFFF;--card:#FFFFFF;--item:#F9F7F2;--ink:#1D1B16;--muted:#76746F;--border:#E5E2DC;--wire:#A8A49D;--grid:rgba(29,27,22,0.07);--primary:#2473FE;--glow:#2473FE;--glow-opacity:0.16;--warm:#B45309}
.paper{fill:var(--paper)}
.frame{fill:none;stroke:var(--border);stroke-width:1}
.line{stroke:var(--border);stroke-width:1;fill:none}
.box{fill:var(--card);stroke:var(--border);stroke-width:1}
.item{fill:var(--item);stroke:var(--border);stroke-width:1}
.primary{fill:var(--card);stroke:var(--primary);stroke-width:1.5}
.warm{fill:none;stroke:var(--warm);stroke-width:1}
.wire{stroke:var(--wire);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dashed{stroke-dasharray:5 4}
.gridline{stroke:var(--grid);stroke-width:1;fill:none}
.mark-primary{fill:var(--primary)}
.mark-muted{fill:var(--muted)}
.mark-warm{fill:var(--warm)}
.logo{stroke:var(--primary);fill:none;stroke-width:72;stroke-linecap:round;stroke-linejoin:round}
.logo-dot{fill:var(--primary)}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-weight:600;font-size:22px;letter-spacing:-.3px}
.label{font-weight:600;font-size:19px;letter-spacing:-.2px}
.text{font-size:16px}
.small{font-size:15px;fill:var(--muted)}
.mono,.caption,.code,.event{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.mono{font-size:14px;fill:var(--muted)}
.code{font-size:15px;fill:var(--ink)}
.event{font-size:15px;fill:var(--primary)}
.caption{font-size:12px;letter-spacing:1.2px;fill:var(--muted)}
.accent{fill:var(--primary)}
.muted{fill:var(--muted)}
.warmtext{fill:var(--warm)}
</style>
<defs><clipPath id="hero-clip"><rect x=".5" y=".5" width="879" height="299" rx="16"/></clipPath><radialGradient id="hero-fade" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff" stop-opacity=".6"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="hero-mask"><rect width="880" height="300" fill="url(#hero-fade)"/></mask><radialGradient id="hero-glow" cx=".5" cy="0" r=".7"><stop offset="0" style="stop-color:var(--glow);stop-opacity:var(--glow-opacity)"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient></defs><g clip-path="url(#hero-clip)"><rect width="880" height="300" class="paper"/><path d="M20 0V300M60 0V300M100 0V300M140 0V300M180 0V300M220 0V300M260 0V300M300 0V300M340 0V300M380 0V300M420 0V300M460 0V300M500 0V300M540 0V300M580 0V300M620 0V300M660 0V300M700 0V300M740 0V300M780 0V300M820 0V300M860 0V300M0 20H880M0 60H880M0 100H880M0 140H880M0 180H880M0 220H880M0 260H880" class="gridline" mask="url(#hero-mask)"/><rect width="880" height="300" fill="url(#hero-glow)"/></g><rect x=".5" y=".5" width="879" height="299" rx="16" class="frame"/>
<g transform="translate(349 44) scale(.041)">
  <path class="logo" d="M110 280 H420 C480 280 500 250 500 200 V155 C500 105 530 80 585 80 H790"/>
  <path class="logo" d="M110 440 H515 C570 440 590 410 590 360 V315 C590 265 620 240 675 240 H875"/>
  <path class="logo" d="M110 600 H485 C540 600 565 630 565 680 V715 C565 765 595 785 650 785 H830"/>
  <circle class="logo-dot" cx="820" cy="80" r="58"/><circle class="logo-dot" cx="905" cy="240" r="58"/><circle class="logo-dot" cx="860" cy="785" r="58"/>
</g>
<text x="402" y="74" style="font-weight:600;font-size:36px;letter-spacing:-.5px">threads</text>
<text x="440" y="172" text-anchor="middle" style="font-weight:600;font-size:56px;letter-spacing:-1px">Agents you can <tspan class="accent">replay</tspan>,</text>
<text x="440" y="238" text-anchor="middle" style="font-weight:600;font-size:56px;letter-spacing:-1px"><tspan class="accent">fork</tspan> and <tspan class="accent">trust</tspan>.</text>
</svg>
