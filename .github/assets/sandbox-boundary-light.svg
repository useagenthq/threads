<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-labelledby="sbx-title sbx-desc">
<title id="sbx-title">Code runs in the sandbox. Your keys stay on the host.</title>
<desc id="sbx-desc">Your process holds the agent loop, your tools, hooks and permissions, your model and sandbox API keys, and a git gateway for git_push and pull requests. It sends tool calls to the sandbox (E2B, Daytona or Modal), which runs bash, read, write, edit, ls, glob, grep and notebook_edit, and returns results. The sandbox has no credentials and no internet by default.</desc>
<style>@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}:root{--paper:#F7FAFF;--card:#FFFFFF;--ink:#13243A;--muted:#4A5E78;--line:#BBCBE0;--wire:#586D89;--soft:#EDF3FC;--dot:#D7E3F3;--primary:#2563EB;--primary-soft:#E8F0FE;--secondary:#007F78;--secondary-soft:#E1F3EF;--warm:#B45309;--warm-soft:#FFF0DF}
.paper{fill:var(--paper)}
.frame{fill:var(--paper);stroke:var(--line);stroke-width:1}
.line{stroke:var(--line);stroke-width:1;fill:none}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.soft{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
.primary{fill:var(--primary-soft);stroke:var(--primary);stroke-width:1.5}
.secondary{fill:var(--secondary-soft);stroke:var(--secondary);stroke-width:1.5}
.warm{fill:var(--warm-soft);stroke:var(--warm);stroke-width:1.5}
.wire{stroke:var(--wire);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dashed{stroke-dasharray:6 4}
.dot{fill:var(--dot)}
.mark-primary{fill:var(--primary)}
.mark-secondary{fill:var(--secondary)}
.mark-warm{fill:var(--warm)}
.logo{stroke:var(--primary);fill:none;stroke-width:72;stroke-linecap:round;stroke-linejoin:round}
.logo-dot{fill:var(--primary)}
text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-weight:600;font-size:22px}
.label{font-weight:600;font-size:20px}
.text{font-size:17px}
.small{font-size:15px;fill:var(--muted)}
.mono,.caption,.code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.mono{font-size:15px;fill:var(--muted)}
.code{font-size:15px;fill:var(--ink)}
.caption{font-size:13px;letter-spacing:1px;fill:var(--muted)}
.accent{fill:var(--primary)}
.muted{fill:var(--muted)}
.warmtext{fill:var(--warm)}
</style>
<defs><pattern id="sbx-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" class="dot"/></pattern></defs>
<rect x=".5" y=".5" width="879" height="427" rx="16" class="frame"/>
<rect x="12" y="12" width="856" height="404" rx="8" fill="url(#sbx-dots)"/>
<text x="32" y="50" class="title">Code runs in the sandbox. Your keys stay on the host.</text>

<path d="M372 190 L508 190 M501 185 L508 190 L501 195" class="wire"/>
<text x="440" y="178" class="mono" text-anchor="middle">tool calls</text>
<path d="M508 236 L372 236" class="wire dashed"/><path d="M379 231 L372 236 L379 241" class="wire"/>
<text x="440" y="224" class="mono" text-anchor="middle">results</text>

<rect x="32" y="96" width="340" height="270" rx="8" class="primary"/>
<rect x="52" y="117" width="14" height="14" rx="2" class="mark-primary"/>
<text x="76" y="130" class="label">Your process</text>
<path d="M52 148 L352 148" class="line"/>
<rect x="52" y="172" width="300" height="36" rx="4" class="box"/><text x="68" y="196" class="text">Agent loop and your tools</text>
<rect x="52" y="218" width="300" height="36" rx="4" class="box"/><text x="68" y="242" class="text">Hooks and permissions</text>
<rect x="52" y="264" width="300" height="36" rx="4" class="box"/><path d="M66 289 L73 276 L80 289 Z" class="mark-warm"/><text x="90" y="288" class="text">Model and sandbox API keys</text>
<rect x="52" y="310" width="300" height="36" rx="4" class="box"/><text x="68" y="334" class="text">Git gateway: git_push, open PR</text>

<rect x="508" y="96" width="340" height="270" rx="8" class="secondary"/>
<circle cx="535" cy="124" r="7" class="mark-secondary"/>
<text x="552" y="130" class="label">Sandbox</text>
<text x="828" y="129" class="caption" text-anchor="end">E2B · DAYTONA · MODAL</text>
<path d="M528 148 L828 148" class="line"/>
<rect x="528" y="172" width="300" height="36" rx="4" class="box"/><text x="544" y="196" class="text">bash, read, write, edit</text>
<rect x="528" y="218" width="300" height="36" rx="4" class="box"/><text x="544" y="242" class="text">ls, glob, grep, notebook_edit</text>
<rect x="528" y="264" width="300" height="36" rx="4" class="box"/><path d="M542 289 L549 276 L556 289 Z" class="mark-warm"/><text x="566" y="288" class="text">No credentials, ever</text>
<rect x="528" y="310" width="300" height="36" rx="4" class="box"/><text x="544" y="334" class="text">No internet by default</text>

<text x="440" y="402" class="small" text-anchor="middle">The agent reaches the sandbox only through tools. Credentials never enter it.</text>
</svg>
