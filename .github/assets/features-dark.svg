<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="What's built in: timeline and fork, evals, sandboxes, channels, knowledge base, memory, hooks, tools/MCP/subagents">
<rect x="2" y="2" width="284" height="200" rx="12" fill="#1c2f57" stroke="#6b93e6" stroke-width="1.5"/>
<text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Timeline and fork</text>
<text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">See every step. Fork a saved step</text>
<text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">and try another approach.</text>
<rect x="24" y="150" width="123" height="30" rx="6" fill="#0e1627"/>
<text x="34" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">thread.fork()</text>
<rect x="302" y="2" width="284" height="200" rx="12" fill="#1c2f57" stroke="#6b93e6" stroke-width="1.5"/>
<text x="324" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Evals</text>
<text x="324" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Turn recorded runs into</text>
<text x="324" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">regression tests for CI.</text>
<rect x="324" y="150" width="154" height="30" rx="6" fill="#0e1627"/>
<text x="334" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">thread.saveCase()</text>
<rect x="602" y="2" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="624" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Sandboxes</text>
<text x="624" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Code runs in E2B, Daytona or</text>
<text x="624" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Modal. Start, snapshot and</text>
<text x="624" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">clean up are handled.</text>
<rect x="624" y="150" width="170" height="30" rx="6" fill="#0e1627"/>
<text x="634" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">e2b() · E2B_API_KEY</text>
<rect x="902" y="2" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="924" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Channels</text>
<text x="924" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Slack, WhatsApp and GitHub.</text>
<text x="924" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Same agent everywhere.</text>
<rect x="924" y="150" width="178" height="30" rx="6" fill="#0e1627"/>
<text x="934" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">slack() · whatsapp()</text>
<rect x="2" y="218" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="24" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Knowledge base</text>
<text x="24" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Point at your docs; the agent</text>
<text x="24" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">can search them.</text>
<rect x="24" y="366" width="218" height="30" rx="6" fill="#0e1627"/>
<text x="34" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">localKnowledge({ paths })</text>
<rect x="302" y="218" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="324" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Memory</text>
<text x="324" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Remembers facts per user or repo,</text>
<text x="324" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">never mixed between customers.</text>
<rect x="324" y="366" width="186" height="30" rx="6" fill="#0e1627"/>
<text x="334" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">localMemory() · zep()</text>
<rect x="602" y="218" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="624" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Hooks</text>
<text x="624" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Approvals, guards and logging,</text>
<text x="624" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">without rewriting them.</text>
<rect x="624" y="366" width="178" height="30" rx="6" fill="#0e1627"/>
<text x="634" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">extension({ hooks })</text>
<rect x="902" y="218" width="284" height="200" rx="12" fill="#161f33" stroke="#2a3650" stroke-width="1.5"/>
<text x="924" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#eef2fb">Tools, MCP, subagents</text>
<text x="924" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">Your tools, any MCP server,</text>
<text x="924" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a9b5cc">helper agents.</text>
<rect x="924" y="366" width="162" height="30" rx="6" fill="#0e1627"/>
<text x="934" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d5def0">mcp({ name, url })</text>
</svg>
