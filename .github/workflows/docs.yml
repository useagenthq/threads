name: docs

on:
  push:
    paths:
      - "docs/**"
      - "spec/**"
      - "scripts/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "python/.python-version"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "spec/**"
      - "scripts/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "python/.python-version"
      - ".github/workflows/docs.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: python
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --locked --all-extras
        working-directory: python
      - name: Generate code from spec/
        working-directory: .
        run: ./scripts/generate.sh
      - name: Generator scripts are strictly typed
        working-directory: python
        run: |
          uv run ruff check ../docs/scripts
          uv run ruff format --check ../docs/scripts
          uv run pyright ../docs/scripts
      - name: No file over 400 lines
        working-directory: .
        run: ./scripts/check-file-size.sh docs/scripts
      - run: bun install --frozen-lockfile
      - run: bun run check:gen
      - run: bun run types:check
      - run: bun run lint
      - run: bun run build
      - run: bun run check:links
