name: python

on:
  push:
    paths: ["python/**", "spec/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "spec/**", ".github/workflows/python.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: python
      - run: uv sync --locked
      - run: uv run pyright
      - run: uv run pyright --verifytypes threads --ignoreexternal
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run python tools/regen_models.py --check
      - name: Spec tooling is strictly typed and fixtures are current
        run: |
          uv run pyright ../spec/tools
          uv run ruff check ../spec/tools
          uv run ruff format --check ../spec/tools
          uv run python ../spec/tools/gen_fixtures.py --check
          uv run python ../spec/tools/check_api.py
      - name: No file over 400 lines
        working-directory: .
        run: ./scripts/check-file-size.sh python
