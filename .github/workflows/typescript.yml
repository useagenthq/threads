name: typescript

on:
  push:
    paths: ["typescript/**", "spec/**", "scripts/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["typescript/**", "spec/**", "scripts/**", ".github/workflows/typescript.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          # The API surface gate compares against the base commit, so it needs history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Model catalogs are append-only
        working-directory: .
        run: python3 spec/tools/check_model_catalog.py
      - name: API surface base
        working-directory: .
        run: |
          BASE=$(scripts/surface-base.sh --event "${{ github.event_name }}" \
            --base-ref "${{ github.base_ref }}" --before "${{ github.event.before }}")
          if git cat-file -e "$BASE:spec/api-surface-gaps.json" 2>/dev/null; then
            git show "$BASE:spec/api-surface-gaps.json" > "$RUNNER_TEMP/base-gaps.json"
            git show "$BASE:spec/api.json" > "$RUNNER_TEMP/base-api.json"
            echo "SURFACE_MODE=--baseline $RUNNER_TEMP/base-gaps.json --baseline-api $RUNNER_TEMP/base-api.json" >> "$GITHUB_ENV"
          else
            echo "SURFACE_MODE=--bootstrap $BASE" >> "$GITHUB_ENV"
          fi
      - name: API surface gate
        working-directory: .
        run: python3 spec/tools/check_surface.py --lang ts --junit typescript/junit.xml $SURFACE_MODE
      - name: No file over 400 lines
        working-directory: .
        run: ./scripts/check-file-size.sh typescript
